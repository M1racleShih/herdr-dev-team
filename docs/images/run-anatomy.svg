<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Inside a run</title><desc id="desc">Skill instructions provide role briefs and handoff rules. Role workers take turns running project tools in a shared dedicated Git worktree. The Python handoff helper validates receipts, records the run in a private SQLite store with evidence files, and dispatches the next assignment through Herdr Core using hc to the next terminal.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Who hands off to whom?</title><desc id="desc">The two-pack moves from Coder to Cleaner, who signs off. The four-pack moves from Specifier through human approval to Coder, Refactorer and Architect, who signs off. The six-pack moves from Specifier through human approval to Coder, Cleaner, Architect, Hardener and independent QA, who signs off. Human approval is not a role.</desc>
